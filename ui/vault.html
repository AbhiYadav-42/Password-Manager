<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT — Password Manager</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: #1a1a1a !important; }
    body { display: block; overflow: hidden; height: 100vh; }

    #app { display: flex; flex-direction: column; height: 100vh; }

    .list-wrap { flex: 1; overflow-y: auto; padding: 0 16px 14px; }

    /* ── Add modal ── */
    .modal-field-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      min-width: 82px;
      white-space: nowrap;
    }
    .modal-field-row .entry-box { flex: 1; }
    .modal-field-row .entry-box input { font-size: 13px; padding: 11px 4px; }

    .modal-footer { display: flex; gap: 10px; margin-top: 18px; }
    .modal-footer .btn-primary { flex: 1; font-size: 14px; padding: 13px; }
    .btn-cancel {
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid var(--border-hv);
      color: var(--text);
      border-radius: 7px;
      padding: 13px 18px;
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-cancel:hover { border-color: var(--subtext); }

    /* optional-hint */
    .optional-hint { font-size: 10px; color: var(--subtext); margin-left: 4px; }

    /* strength row */
    .strength-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; margin-left: 94px; }

    /* ── Vault row ── */
    .vault-row {
      display: flex;
      align-items: center;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 7px;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .vault-row:hover { border-color: var(--accent-dim); }

    /* favicon */
    .favicon {
      width: 22px; height: 22px;
      border-radius: 4px;
      object-fit: contain;
      background: var(--glass2);
      flex-shrink: 0;
    }
    .favicon-fallback {
      width: 22px; height: 22px;
      border-radius: 4px;
      background: var(--glass2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--subtext);
      flex-shrink: 0;
    }

    /* row info */
    .row-info { flex: 1; min-width: 0; }
    .row-site { font-size: 13px; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-user { font-size: 11px; color: var(--subtext); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .pw-dots { color: var(--subtext); font-size: 11px; flex-shrink: 0; }

    /* copy buttons */
    .row-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .btn-copy-user {
      background: var(--glass2);
      color: var(--subtext);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-copy-user:hover { color: var(--text); border-color: var(--border-hv); }
    .btn-copy-pw {
      background: var(--glass2);
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy-pw:hover { background: var(--glass3); }
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 10px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      transition: background 0.15s, color 0.15s;
    }
    .btn-delete:hover { background: #2a1010; color: #e05c5c; }

    /* ── Delete confirm ── */
    .confirm-dialog {
      background: var(--glass);
      border: 1px solid #c0392b;
      border-radius: 8px;
      padding: 22px;
      width: 300px;
    }
    .confirm-dialog p { font-size: 13px; color: var(--subtext); margin-bottom: 18px; line-height: 1.6; }
    .confirm-dialog p span { color: var(--text); }
    .confirm-btns { display: flex; gap: 10px; }
    .btn-danger {
      flex: 1; background: #c0392b; color: #fff;
      border: none; border-radius: 6px; padding: 10px;
      font-family: var(--mono); font-size: 12px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-danger:hover { opacity: 0.85; }

    /* topbar count */
    .topbar-count { font-size: 11px; color: var(--subtext); flex: 1; }
    .topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; }

    /* search input bigger */
    .search-box input { font-size: 13px; padding: 10px 6px; }

    /* empty state */
    .empty-state { text-align: center; color: var(--subtext); font-size: 13px; line-height: 1.9; padding: 70px 20px; }

    /* btn-icon bigger */
    .btn-icon { width: 36px; height: 36px; font-size: 20px; }

    /* status */
    .status { font-size: 12px; min-height: 18px; margin-top: 10px; }

    /* ── Edit button in row ── */
    .btn-edit {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 5px;
      border-radius: 4px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-edit:hover { background: var(--glass2); }

    /* ── Master password verify popup ── */
    .verify-dialog {
      background: var(--glass);
      border: 1px solid var(--accent-dim);
      border-radius: 10px;
      width: 320px;
      overflow: hidden;
    }
    .verify-dialog .card-stripe { height: 2px; background: var(--accent); }
    .verify-body { padding: 22px 24px; }
    .verify-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--text); margin-bottom: 4px; }
    .verify-sub { font-size: 11px; color: var(--subtext); margin-bottom: 18px; }
    .verify-btns { display: flex; gap: 10px; margin-top: 16px; }
    .verify-btns .btn-primary { flex: 1; font-size: 13px; padding: 11px; }

    /* ── Edit entry modal ── */
    .edit-site-locked {
      font-size: 13px;
      color: var(--subtext);
      background: var(--glass2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 11px 14px;
      flex: 1;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lock-icon { opacity: 0.4; }
  </style>
</head>
<body>
<div id="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-stripe"></div>
    <svg class="hex-icon" viewBox="0 0 28 28" fill="none">
      <polygon id="hex-poly" stroke-width="1.5" fill="none"/>
      <circle cx="14" cy="14" r="4" id="hex-dot"/>
    </svg>
    <div class="topbar-title">VAULT</div>
    <div class="topbar-count" id="count-lbl">0 entries</div>
    <button class="btn-icon" onclick="openAddModal()" title="Add entry">
      <img src="../fonts/add.png" class="icon-img icon-lg">
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <img src="../fonts/search.png" class="icon-img icon-md search-icon">
      <input type="text" id="search" placeholder="search entries…" oninput="onSearch()">
    </div>
  </div>

  <!-- List -->
  <div class="list-wrap" id="list-wrap">
    <div class="empty-state" id="empty-state">
      // vault is empty<br>→ press ＋ to add an entry
    </div>
  </div>

</div>

<!-- ── Add Modal ── -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="card-stripe"></div>
    <div class="modal-header">
      <button class="btn-cancel" onclick="closeAddModal()">
        <img src="../fonts/delete.png" class="icon-img icon-sm" style="vertical-align:middle;opacity:0.6;"> Cancel
      </button>
      <div class="modal-title">NEW ENTRY</div>
      <div style="width:90px;"></div>
    </div>
    <div class="modal-body">

      <div class="modal-field-row">
        <div class="modal-field-label">Website</div>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="text" id="add-site" placeholder="e.g. github.com" autocomplete="off">
        </div>
      </div>

      <div class="modal-field-row">
        <div class="modal-field-label">
          Username
          <span class="optional-hint">(optional)</span>
        </div>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="text" id="add-user" placeholder="leave blank to skip" autocomplete="off">
        </div>
      </div>

      <div class="modal-field-row">
        <div class="modal-field-label">Password</div>
        <div class="entry-box">
          <img src="../fonts/key.png" class="icon-img icon-md entry-icon">
          <input type="password" id="add-pw" placeholder="••••••••" oninput="onPwChange()">
          <button class="eye-btn" onclick="toggleEye('add-pw', this)">
            <img src="../fonts/eye.png" class="icon-img icon-md eye-icon-img">
          </button>
        </div>
      </div>

      <!-- Strength -->
      <div class="strength-row">
        <div class="strength-bar-track">
          <div class="strength-bar-fill" id="str-bar"></div>
        </div>
        <div class="strength-label" id="str-lbl"></div>
      </div>

      <div class="status" id="add-status"></div>

      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEntry()">Add</button>
      </div>

    </div>
  </div>
</div>

<!-- ── Delete Confirm ── -->
<div class="overlay" id="del-overlay">
  <div class="confirm-dialog">
    <p>Remove <span id="del-site-name">'site'</span> from vault?</p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeDelModal()">Cancel</button>
      <button class="btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- ── Verify Master Password ── -->
<div class="overlay" id="verify-overlay">
  <div class="verify-dialog">
    <div class="card-stripe"></div>
    <div class="verify-body">
      <div class="verify-title">CONFIRM IDENTITY</div>
      <div class="verify-sub">Enter master password to edit this entry</div>
      <div class="entry-box">
        <img src="../fonts/key.png" class="icon-img icon-md entry-icon">
        <input type="password" id="verify-pw" placeholder="master password">
        <button class="eye-btn" onclick="toggleEyeById('verify-pw', this)">
          <img src="../fonts/eye.png" class="icon-img icon-md eye-icon-img">
        </button>
      </div>
      <div class="status" id="verify-status"></div>
      <div class="verify-btns">
        <button class="btn-cancel" onclick="closeVerifyModal()">Cancel</button>
        <button class="btn-primary" onclick="submitVerify()">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Edit Entry Modal ── -->
<div class="overlay" id="edit-overlay">
  <div class="modal">
    <div class="card-stripe"></div>
    <div class="modal-header">
      <button class="btn-cancel" onclick="closeEditModal()">
        <img src="../fonts/delete.png" class="icon-img icon-sm" style="vertical-align:middle;opacity:0.6;"> Cancel
      </button>
      <div class="modal-title">EDIT ENTRY</div>
      <div style="width:90px;"></div>
    </div>
    <div class="modal-body">

      <!-- Website: locked, not editable -->
      <div class="modal-field-row">
        <div class="modal-field-label">Website</div>
        <div class="edit-site-locked">
          <img src="../fonts/delete.png" class="icon-img icon-sm lock-icon">
          <span id="edit-site-display">—</span>
        </div>
      </div>

      <!-- Username: editable -->
      <div class="modal-field-row">
        <div class="modal-field-label">Username</div>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="text" id="edit-user" placeholder="leave blank to remove" autocomplete="off">
        </div>
      </div>

      <!-- Password: editable, unmasked -->
      <div class="modal-field-row">
        <div class="modal-field-label">Password</div>
        <div class="entry-box">
          <img src="../fonts/key.png" class="icon-img icon-md entry-icon">
          <input type="text" id="edit-pw" placeholder="new password">
          <button class="eye-btn" onclick="toggleEyeById('edit-pw', this)">
            <img src="../fonts/eye.png" class="icon-img icon-md eye-icon-img">
          </button>
        </div>
      </div>

      <div class="status" id="edit-status"></div>

      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      </div>

    </div>
  </div>
</div>

<!-- Top-center toast -->
<div class="toast toast-top" id="toast"></div>

<script>
  // ── Accent ─────────────────────────────────────────────────────────────────
  const ACCENTS = ["#e8920f","#00c896","#00aaff","#c061cb","#e05c5c","#5cb8e0","#b8e05c"];
  function hexToRgb(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;return[r,g,b];}
  function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');}
  function rgbToHsv(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=max===0?0:d/max,v=max;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}return[h,s,v];}
  function hsvToRgb(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];}
  function deriveAccent(hex){const[r,g,b]=hexToRgb(hex);let[h,s,v]=rgbToHsv(r,g,b);return{hv:rgbToHex(...hsvToRgb(h,Math.max(0,s-0.05),Math.min(1,v+0.12))),dim:rgbToHex(...hsvToRgb(h,s,v*0.38)),glow:rgbToHex(...hsvToRgb(h,s*0.8,v*0.82))};}

  let accent = sessionStorage.getItem('vault_accent');
  if (!accent) { accent = ACCENTS[Math.floor(Math.random()*ACCENTS.length)]; sessionStorage.setItem('vault_accent', accent); }
  const {hv, dim, glow} = deriveAccent(accent);
  const root = document.documentElement;
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-hv', hv);
  root.style.setProperty('--accent-dim', dim);
  root.style.setProperty('--glow', glow);

  function drawHex(polyId, dotId, cx, cy, r) {
    const pts = Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-30);return`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`;}).join(' ');
    document.getElementById(polyId).setAttribute('points', pts);
    document.getElementById(polyId).setAttribute('stroke', accent);
    document.getElementById(dotId).setAttribute('fill', accent);
  }
  drawHex('hex-poly','hex-dot',14,14,11);
  document.querySelector('.topbar-stripe').style.background = accent;

  // ── State ──────────────────────────────────────────────────────────────────
  let entries = [];
  let pendingDelete = null;

  // ── Favicon helper ─────────────────────────────────────────────────────────
  function faviconUrl(site) {
    // Extract clean domain from whatever the user typed
    let domain = site.trim().toLowerCase();
    domain = domain.replace(/^https?:\/\//, '').split('/')[0];
    return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
  }

  function makeFaviconEl(site) {
    const img = document.createElement('img');
    img.className = 'favicon';
    img.src = faviconUrl(site);
    img.alt = '';
    img.onerror = () => {
      // fallback: show first letter
      const fb = document.createElement('div');
      fb.className = 'favicon-fallback';
      fb.textContent = site.charAt(0).toUpperCase();
      img.replaceWith(fb);
    };
    return img;
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  window.addEventListener('pywebviewready', loadPasswords);
  if (typeof pywebview !== 'undefined') loadPasswords();

  async function loadPasswords() {
    const res = await pywebview.api.get_passwords();
    if (!res.success) { showToast('// ' + res.error); return; }
    entries = res.data;
    renderAll();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderAll(filter='') {
    const wrap = document.getElementById('list-wrap');
    wrap.querySelectorAll('.vault-row').forEach(el => el.remove());
    const q = filter.toLowerCase();
    const visible = entries.filter(e => e.site.toLowerCase().includes(q) || (e.username||'').toLowerCase().includes(q));
    document.getElementById('empty-state').style.display = entries.length === 0 ? 'block' : 'none';
    visible.forEach(e => wrap.appendChild(makeRow(e)));
    updateCount();
  }

  function makeRow(entry) {
    const row = document.createElement('div');
    row.className = 'vault-row';
    row.dataset.site = entry.site;

    // Favicon
    row.appendChild(makeFaviconEl(entry.site));

    // Info + edit button wrapper
    const infoWrap = document.createElement('div');
    infoWrap.style.cssText = 'flex:1;min-width:0;display:flex;align-items:center;gap:6px;';

    const info = document.createElement('div');
    info.className = 'row-info';
    const siteName = document.createElement('div');
    siteName.className = 'row-site';
    siteName.textContent = entry.site;
    info.appendChild(siteName);
    if (entry.username) {
      const userEl = document.createElement('div');
      userEl.className = 'row-user';
      userEl.textContent = entry.username;
      info.appendChild(userEl);
    }

    // Edit pencil button
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-edit';
    editBtn.title = 'Edit entry';
    editBtn.innerHTML = '<img src="../fonts/edit.png" class="icon-img icon-sm">';
    editBtn.onclick = () => openVerifyModal(entry.site);

    infoWrap.appendChild(info);
    infoWrap.appendChild(editBtn);
    row.appendChild(infoWrap);

    // Dots
    const dots = document.createElement('div');
    dots.className = 'pw-dots';
    dots.textContent = '●●●●●●';
    row.appendChild(dots);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'row-actions';

    // Copy username button
    const copyUser = document.createElement('button');
    copyUser.className = 'btn-copy-user';
    copyUser.innerHTML = '<img src="../fonts/user.png" class="icon-img icon-sm" style="vertical-align:middle;"> USER';
    copyUser.title = 'Copy username';
    copyUser.onclick = () => {
      if (!entry.username) {
        showToast('  ⚠  no username to copy  ');
        return;
      }
      navigator.clipboard.writeText(entry.username).then(() => {
        showToast('  ✓  username copied  ');
      });
    };

    // Copy password button
    const copyPw = document.createElement('button');
    copyPw.className = 'btn-copy-pw';
    copyPw.innerHTML = '<img src="../fonts/copy.png" class="icon-img icon-sm" style="vertical-align:middle;"> PASS';
    copyPw.title = 'Copy password';
    copyPw.onclick = () => {
      navigator.clipboard.writeText(entry.password).then(() => {
        showToast('  🔒  password copied  ');
      });
    };

    // Delete
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-delete';
    delBtn.innerHTML = '<img src="../fonts/delete.png" class="icon-img icon-md">';
    delBtn.title = 'Delete entry';
    delBtn.onclick = () => openDelModal(entry.site);

    actions.appendChild(copyUser);
    actions.appendChild(copyPw);
    actions.appendChild(delBtn);
    row.appendChild(actions);
    return row;
  }

  function updateCount() {
    const n = entries.length;
    document.getElementById('count-lbl').textContent = `${n} ${n===1?'entry':'entries'}`;
  }

  function onSearch() { renderAll(document.getElementById('search').value); }

  // ── Add Modal ──────────────────────────────────────────────────────────────
  const STR_COLORS = ['#3a3a3a','#c0392b','#d4820a','#8fbc5a','#27ae60'];
  const STR_LABELS = ['','WEAK','FAIR','GOOD','STRONG'];

  function openAddModal() {
    ['add-site','add-user','add-pw'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('add-status').textContent = '';
    document.getElementById('str-bar').style.width = '0%';
    document.getElementById('str-lbl').textContent = '';
    document.getElementById('add-overlay').classList.add('show');
    setTimeout(() => document.getElementById('add-site').focus(), 150);
  }

  function closeAddModal() { document.getElementById('add-overlay').classList.remove('show'); }

  function toggleEye(id, btn) {
    const inp = document.getElementById(id);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    // eye.png = visible state, use opacity trick for hidden state
    const img = btn.querySelector('.eye-icon-img');
    img.style.opacity = isHidden ? '1' : '0.4';
    img.title = isHidden ? 'Hide password' : 'Show password';
  }

  function onPwChange() {
    const pw = document.getElementById('add-pw').value;
    let s = 0;
    if (pw.length >= 8) s++;
    if (/\d/.test(pw)) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    const bar = document.getElementById('str-bar');
    const lbl = document.getElementById('str-lbl');
    bar.style.width = (s/4*100)+'%';
    bar.style.background = STR_COLORS[s];
    lbl.textContent = STR_LABELS[s];
    lbl.style.color = STR_COLORS[s];
  }

  async function saveEntry() {
    const site = document.getElementById('add-site').value.trim();
    const username = document.getElementById('add-user').value.trim();
    const pw = document.getElementById('add-pw').value;
    const status = document.getElementById('add-status');
    if (!site) { status.textContent = '// website cannot be empty'; return; }
    if (!pw)   { status.textContent = '// password cannot be empty'; return; }

    const res = await pywebview.api.add_password(site, pw, username);
    if (res.success) {
      entries.push(res.data);
      renderAll(document.getElementById('search').value);
      closeAddModal();
      showToast(`  🔒  '${site}' encrypted & stored  `);
    } else {
      status.textContent = '// ' + res.error;
    }
  }

  // ── Edit flow state ────────────────────────────────────────────────────────
  let pendingEditSite = null;   // site being edited, set when verify opens

  // Generic eye toggle by input id (used for verify + edit modals)
  function toggleEyeById(id, btn) {
    const inp = document.getElementById(id);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    const img = btn.querySelector('.eye-icon-img');
    img.style.opacity = isHidden ? '1' : '0.4';
  }

  // ── Verify modal ───────────────────────────────────────────────────────────
  function openVerifyModal(site) {
    pendingEditSite = site;
    document.getElementById('verify-pw').value = '';
    document.getElementById('verify-status').textContent = '';
    document.getElementById('verify-overlay').classList.add('show');
    setTimeout(() => document.getElementById('verify-pw').focus(), 150);
  }

  function closeVerifyModal() {
    pendingEditSite = null;
    document.getElementById('verify-overlay').classList.remove('show');
  }

  async function submitVerify() {
    const pw = document.getElementById('verify-pw').value;
    if (!pw) { document.getElementById('verify-status').textContent = '// password required'; return; }

    const res = await pywebview.api.verify_master(pw);
    if (res.success) {
      closeVerifyModal();
      openEditModal(pendingEditSite);
    } else {
      document.getElementById('verify-status').textContent = '// ' + res.error;
      document.getElementById('verify-pw').value = '';
      document.getElementById('verify-pw').focus();
    }
  }

  // ── Edit modal ─────────────────────────────────────────────────────────────
  function openEditModal(site) {
    const entry = entries.find(e => e.site === site);
    if (!entry) return;

    pendingEditSite = site;
    document.getElementById('edit-site-display').textContent = site;
    document.getElementById('edit-user').value = entry.username || '';
    document.getElementById('edit-pw').value = entry.password;   // unmasked — verified already
    document.getElementById('edit-status').textContent = '';
    document.getElementById('edit-overlay').classList.add('show');
    setTimeout(() => document.getElementById('edit-user').focus(), 150);
  }

  function closeEditModal() {
    pendingEditSite = null;
    document.getElementById('edit-overlay').classList.remove('show');
  }

  async function saveEdit() {
    const site     = pendingEditSite;
    const username = document.getElementById('edit-user').value.trim();
    const password = document.getElementById('edit-pw').value;
    const status   = document.getElementById('edit-status');

    if (!password) { status.textContent = '// password cannot be empty'; return; }

    const res = await pywebview.api.update_password(site, password, username);
    if (res.success) {
      // Update local entries array
      const idx = entries.findIndex(e => e.site === site);
      if (idx !== -1) entries[idx] = { site, password, username };
      renderAll(document.getElementById('search').value);
      closeEditModal();
      showToast(`  ✏️  '${site}' updated  `);
    } else {
      status.textContent = '// ' + res.error;
    }
  }

  // ── Delete Modal ───────────────────────────────────────────────────────────
  function openDelModal(site) {
    pendingDelete = site;
    document.getElementById('del-site-name').textContent = `'${site}'`;
    document.getElementById('del-overlay').classList.add('show');
  }
  function closeDelModal() { pendingDelete = null; document.getElementById('del-overlay').classList.remove('show'); }

  async function confirmDelete() {
    if (!pendingDelete) return;
    const site = pendingDelete;
    const res = await pywebview.api.delete_password(site);
    closeDelModal();
    if (res.success) {
      entries = entries.filter(e => e.site !== site);
      renderAll(document.getElementById('search').value);
      showToast(`  ✕  '${site}' removed  `);
    } else {
      showToast('// ' + res.error);
    }
  }

  // ── Keyboard ───────────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeAddModal(); closeDelModal(); closeVerifyModal(); closeEditModal(); }
    if (e.key === 'Enter' && document.getElementById('add-overlay').classList.contains('show')) saveEntry();
    if (e.key === 'Enter' && document.getElementById('del-overlay').classList.contains('show')) confirmDelete();
    if (e.key === 'Enter' && document.getElementById('verify-overlay').classList.contains('show')) submitVerify();
    if (e.key === 'Enter' && document.getElementById('edit-overlay').classList.contains('show')) saveEdit();
  });

  // ── Toast (top-center) ─────────────────────────────────────────────────────
  function showToast(msg, ms=2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms);
  }
</script>
</body>
</html>
