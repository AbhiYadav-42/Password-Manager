<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: #1a1a1a !important; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .container {
      width: 88%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Brand block ── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    /* Glowing ring wrapper */
    .brand-logo-wrap {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 14px;
      cursor: default;

      /* ring + inner glow — color set by JS via CSS var */
      background: radial-gradient(circle, var(--logo-glow-inner) 0%, var(--logo-glow-outer) 55%, transparent 75%);
      box-shadow:
        0 0 18px var(--logo-shadow-1),
        0 0 40px var(--logo-shadow-2),
        inset 0 0 20px var(--logo-shadow-3);

      transition: box-shadow 0.3s ease;
    }

    /* Heartbeat / ocean-wave pulse on hover */
    .brand-logo-wrap:hover {
      animation: heartbeat 1.4s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%   { box-shadow: 0 0 18px var(--logo-shadow-1), 0 0 40px var(--logo-shadow-2); }
      14%  { box-shadow: 0 0 32px var(--logo-shadow-1), 0 0 70px var(--logo-shadow-2), 0 0 100px var(--logo-shadow-3); }
      28%  { box-shadow: 0 0 18px var(--logo-shadow-1), 0 0 40px var(--logo-shadow-2); }
      42%  { box-shadow: 0 0 28px var(--logo-shadow-1), 0 0 60px var(--logo-shadow-2), 0 0 90px var(--logo-shadow-3); }
      70%  { box-shadow: 0 0 18px var(--logo-shadow-1), 0 0 40px var(--logo-shadow-2); }
      100% { box-shadow: 0 0 18px var(--logo-shadow-1), 0 0 40px var(--logo-shadow-2); }
    }

    .brand-logo {
      width: 128px;
      height: 128px;
      object-fit: contain;
      mix-blend-mode: screen;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .brand-sub { font-size: 12px; color: var(--subtext); }

    /* Card full width */
    .card { width: 100%; }
    .inner { padding: 24px 28px; }
    .field { margin-bottom: 16px; }
    .field-label-top { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; display: block; }
    .confirm-wrap { margin-top: 16px; }
    .entry-box input { font-size: 14px; padding: 12px 4px; }
    .btn-primary { font-size: 14px; padding: 14px; margin-top: 12px; }
    .btn-ghost { font-size: 12px; padding: 10px 14px; margin-top: 6px; }
    .status { font-size: 12px; min-height: 18px; margin-top: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">
    <div class="brand-logo-wrap" id="logo-wrap">
      <img src="../fonts/umbrella.png" class="brand-logo">
    </div>
    <div class="brand-title">Umbrella VAULT</div>
    <div class="brand-sub" id="subtitle">// authenticate to continue</div>
  </div>

  <div class="card">
    <div class="card-stripe"></div>
    <div class="inner">

      <div class="field">
        <label class="field-label-top">Username</label>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="text" id="username" placeholder="enter username" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label class="field-label-top">Master Password</label>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="password" id="password" placeholder="••••••••">
          <button class="eye-btn" onclick="toggleEye('password', this)">
            <img src="../fonts/eye.png" class="icon-img icon-md eye-icon-img">
          </button>
        </div>
      </div>

      <div class="confirm-wrap" id="confirm-wrap" style="display:none;">
        <label class="field-label-top">Confirm Password</label>
        <div class="entry-box">
          <span class="entry-arrow">›</span>
          <input type="password" id="confirm" placeholder="••••••••">
          <button class="eye-btn" onclick="toggleEye('confirm', this)">
            <img src="../fonts/eye.png" class="icon-img icon-md eye-icon-img">
          </button>
        </div>
      </div>

      <div class="status" id="status"></div>
      <button class="btn-primary" id="submit-btn" onclick="submit()">[ UNLOCK ]</button>
      <button class="btn-ghost" id="toggle-btn" onclick="toggleMode()">→ no account yet? register</button>

    </div>
  </div>
</div>

<div class="toast toast-top" id="toast"></div>

<script>
  const ACCENTS = ["#e8920f","#00c896","#00aaff","#c061cb","#e05c5c","#5cb8e0","#b8e05c"];
  function hexToRgb(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;return[r,g,b];}
  function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');}
  function rgbToHsv(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=max===0?0:d/max,v=max;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}return[h,s,v];}
  function hsvToRgb(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];}
  function deriveAccent(hex){const[r,g,b]=hexToRgb(hex);let[h,s,v]=rgbToHsv(r,g,b);return{hv:rgbToHex(...hsvToRgb(h,Math.max(0,s-0.05),Math.min(1,v+0.12))),dim:rgbToHex(...hsvToRgb(h,s,v*0.38)),glow:rgbToHex(...hsvToRgb(h,s*0.8,v*0.82))};}

  let accent = sessionStorage.getItem('vault_accent');
  if (!accent) { accent = ACCENTS[Math.floor(Math.random()*ACCENTS.length)]; sessionStorage.setItem('vault_accent', accent); }
  const {hv, dim, glow} = deriveAccent(accent);
  const root = document.documentElement;
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-hv', hv);
  root.style.setProperty('--accent-dim', dim);
  root.style.setProperty('--glow', glow);

  // Set logo glow colors from accent
  root.style.setProperty('--logo-glow-inner',  accent + '33');  // 20% opacity
  root.style.setProperty('--logo-glow-outer',  accent + '11');  // 7% opacity
  root.style.setProperty('--logo-shadow-1',    accent + '88');  // 53% opacity
  root.style.setProperty('--logo-shadow-2',    accent + '44');  // 27% opacity
  root.style.setProperty('--logo-shadow-3',    accent + '22');  // 13% opacity

  let mode = 'login';

  window.addEventListener('pywebviewready', async () => {
    const res = await pywebview.api.check_has_user();
    if (res.success && !res.data) setMode('register');
  });

  function setMode(m) {
    mode = m;
    const isReg = m === 'register';
    document.getElementById('subtitle').textContent = isReg ? '// initialize new vault' : '// authenticate to continue';
    document.getElementById('submit-btn').textContent = isReg ? '[ CREATE VAULT ]' : '[ UNLOCK ]';
    document.getElementById('toggle-btn').textContent = isReg ? '→ have an account? login' : '→ no account yet? register';
    document.getElementById('confirm-wrap').style.display = isReg ? 'block' : 'none';
    ['username','password','confirm'].forEach(id => document.getElementById(id).value = '');
    setStatus('');
    document.getElementById('username').focus();
  }

  function toggleMode() { setMode(mode === 'login' ? 'register' : 'login'); }

  function toggleEye(id, btn) {
    const inp = document.getElementById(id);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    const img = btn.querySelector('.eye-icon-img');
    img.style.opacity = isHidden ? '1' : '0.4';
  }

  function setStatus(msg, ok=false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (ok ? ' ok' : '');
  }

  async function submit() {
    const btn = document.getElementById('submit-btn');
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const c = document.getElementById('confirm').value;
    btn.disabled = true; btn.textContent = '// ...';
    const res = mode === 'register'
      ? await pywebview.api.register(u, p, c)
      : await pywebview.api.login(u, p);
    if (res.success) {
      setStatus('// access granted ✓', true);
      setTimeout(() => { window.location.href = 'vault.html'; }, 400);
    } else {
      setStatus('// ' + res.error);
      btn.disabled = false;
      btn.textContent = mode === 'register' ? '[ CREATE VAULT ]' : '[ UNLOCK ]';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
